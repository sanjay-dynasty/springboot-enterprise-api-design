server:
  port: 8080

spring:
  application:
    name: springboot_enterprise_api-design

  datasource:
    url: jdbc:mysql://localhost:3306/enterprise_api_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
